name: Build

on:
  push:
    branches:
      - main
  pull_request:
  release:
    types:
      - published
  workflow_dispatch:

env:
  # Disable the .NET logo in the console output.
  # DOTNET_NOLOGO: true
  # Disable the .NET first time experience to skip caching NuGet packages and speed up the build.
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # Disable sending .NET CLI telemetry to Microsoft.
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Set the build number in MinVer.
  MINVERBUILDMETADATA: build.${{github.run_number}}

jobs:
  build:
    name: Build-${{matrix.os}}
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os: [windows-latest]
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0
      - name: configure_java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: "Setup .NET SDK"
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - name: "Ensure workloads" # https://github.com/actions/runner/issues/3578
        run: dotnet workload install maui --version 10.0.103
        shell: pwsh
      - name: "Validate tooling"
        shell: pwsh
        run: |
          java --version
          echo $ENV:JAVA_HOME
          dotnet --version
          dotnet workload list
      # The VirtualScroll native layer is built by Gradle, once per Android target framework, and
      # the .NET Android SDK always invokes it with the no-daemon flag — every run starts a cold
      # JVM that first has to unpack the wrapper distribution and re-resolve dependencies. Caching
      # both takes that work off the critical path; on a cold Windows runner it is most of the
      # budget Gradle's 30s daemon-connection window has to fit into, which is what fails the
      # build with "Timeout waiting to connect to the Gradle daemon".
      - name: "Cache Gradle"
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{runner.os}}-gradle-${{hashFiles('Source/**/AndroidNative/**/*.gradle', 'Source/**/AndroidNative/**/gradle.properties', 'Source/**/AndroidNative/**/gradle-wrapper.properties')}}
          restore-keys: |
            ${{runner.os}}-gradle-

      - name: "Dotnet Tool Restore"
        run: dotnet tool restore
        shell: pwsh
      - name: "Dotnet Cake Build"
        run: dotnet cake --target=Build
        shell: pwsh
      - name: "Dotnet Cake Test"
        run: dotnet cake --target=Test
        shell: pwsh
      - name: "Dotnet Cake Pack"
        run: dotnet cake --target=Pack
        shell: pwsh

      - name: Build Documentation Metadata
        run: dotnet docfx metadata docfx.json
        shell: pwsh
      - name: Build Documentation
        run: dotnet docfx build docfx.json
        shell: pwsh
      - name: Upload Documentation Site
        uses: actions/upload-artifact@v7
        with:
          name: docfx-site
          path: _site

      - name: "Publish Artefacts"
        uses: actions/upload-artifact@v7
        with:
          name: ${{matrix.os}}
          path: "./Artefacts"
      - name: "Publish Binlog"
        uses: actions/upload-artifact@v7
        with:
          name: ${{matrix.os}}-binlog
          path: "./Binlog"

  push-github-packages:
    name: "Push GitHub Packages"
    needs: build
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    environment:
      name: "GitHub Packages"
      url: https://github.com/nalu-development/nalu/packages
    permissions:
      packages: write
    runs-on: windows-latest
    steps:
      - name: "Download Artefact"
        uses: actions/download-artifact@v8
        with:
          name: "windows-latest"
      - name: "Dotnet NuGet Add Source"
        run: dotnet nuget add source https://nuget.pkg.github.com/nalu-development/index.json --name GitHub --username albyrock87 --password ${{secrets.GITHUB_TOKEN}}
        shell: pwsh
      - name: "Dotnet NuGet Push"
        run: dotnet nuget push .\*.nupkg --api-key ${{ github.token }} --source GitHub --skip-duplicate
        shell: pwsh

  push-nuget:
    name: "Push NuGet Packages"
    needs: build
    permissions:
      id-token: write  # enable GitHub OIDC token issuance for this job
    if: github.event_name == 'release'
    environment:
      name: "NuGet"
      url: https://www.nuget.org/packages/Nalu
    runs-on: windows-latest
    steps:
      - name: NuGet login (get temporary API key using OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{secrets.NUGET_USER}}
      - name: "Download Artefact"
        uses: actions/download-artifact@v8
        with:
          name: "windows-latest"
      - name: "Dotnet NuGet Push"
        run: |
          Get-ChildItem .\ -Filter *.nupkg |
          Where-Object { !$_.Name.Contains('preview') } |
          ForEach-Object { dotnet nuget push $_ --source https://api.nuget.org/v3/index.json --skip-duplicate --api-key ${{ steps.login.outputs.NUGET_API_KEY }} }
        shell: pwsh

  deploy-gh-pages:
    name: Deploy GitHub Pages
    needs: build
    # Published docs follow RELEASES, not main: the site should describe the version people can
    # actually install, so it ships on the same event as the NuGet packages. The docfx build still
    # runs on every push and PR (see the build job) — that keeps broken docs from reaching a
    # release, it just no longer publishes.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Documentation Site
        uses: actions/download-artifact@v8
        with:
          name: docfx-site
          path: ./_site

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
